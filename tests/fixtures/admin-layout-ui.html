<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin-Aufräumprüfung – nur Musterdaten</title></head><body><div id="root"></div><script type="module">
import {supabase} from '/supabase.js';
const club='11111111-1111-4111-8111-111111111111';
const membership={user_id:'fixture-admin',club_id:club,role:'superadmin',active:true};
const date={id:'fixture-date',club_id:club,title:'Musterdaten Winter',date:'2099-01-10',time:'10:00',archived:false};
const participant={id:'fixture-person',club_id:club,firstname:'Muster',lastname:'Teilnehmer',email:'muster@example.invalid',phone:'0123456789',tsk_number:'FIXTURE',animal_count:2,chicken_count:2,payment_status:'offen',payment_amount:5,payment_method:'bar',registration_status:'bar_registered',vaccination_date_id:date.id,vaccine:'Newcastle',checked_in:false,checkin_token:'a'.repeat(64)};
const member={id:'fixture-member',club_id:club,firstname:'Muster',lastname:'Mitglied',email:'mitglied@example.invalid',is_active:true,updated_at:'fixture'};
supabase.auth.getSession=async()=>({data:{session:{access_token:'fixture-only'}}});
supabase.rpc=async()=>({data:[],error:null});
supabase.from=table=>{let term='';const q={select(){return q},eq(){return q},order(){return q},limit(){return q},range(){return q},ilike(_key,value){term=value.slice(1,-1);return q},async then(resolve){let data=table==='clubs'?[{id:club,name:'RGZV Musterdaten',slug:'rgzv-hagen',member_price:5,guest_price:10}]:table==='club_admin_memberships'?[membership]:table==='vaccination_dates'?[date]:table==='participants'?[participant]:table==='club_members'?[member]:[];if(term)data=data.filter(row=>JSON.stringify(row).toLowerCase().includes(term.toLowerCase()));resolve({data,error:null,count:data.length})}};return q};
window.fetch=async(url,options)=>{
  const body=options?.body?JSON.parse(options.body):{};
  let result={};
  if(body.action==='smart-assistant')result={status:'green',tasks:[]};
  else if(body.action==='list-admin-memberships')result={administrators:[]};
  else if(body.action==='test-config')result={recipient:null};
  else if(body.action==='qr-preview'||body.action==='qr-resolve')result={participant:{...participant,vaccination_title:date.title,vaccination_date:date.date}};
  else throw new Error('Test verweigert schreibende oder unerwartete Anfrage: '+url);
  return{ok:true,status:200,json:async()=>result};
};
location.hash='#admin';
await import('/main.jsx');
</script></body></html>
