<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokale Check-in-Prüfung – ausschließlich Musterdaten</title></head><body><div id="root"></div><script type="module">
import React from 'react';import{createRoot}from'react-dom/client';import QrCheckinLanding from '/QrCheckinLanding.jsx';import {supabase}from '/supabase.js';import '/styles.css';
