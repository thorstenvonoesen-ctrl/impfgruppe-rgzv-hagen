<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitgliedertarif – ausschließlich lokale Musterdaten</title></head><body><main class="page"><section class="card" style="max-width:800px;margin:24px auto"><h1>Lokale Tarifprüfung</h1><p>Kein echter E-Mail-Versand. Lokaler Testcode: 12345678.</p><div id="root"></div></section></main><script type="module">
import React,{useState} from 'react';import{createRoot}from'react-dom/client';
import MembershipTariff from '/MembershipTariff.jsx';import '/styles.css';
window.fetch=async(_url,options)=>{const b=JSON.parse(options.body);let data;
 if(b.action==='membership-challenge')data={challengeId:'11111111-1111-4111-8111-111111111111',message:'Testcode wurde ausschließlich simuliert.'};
 else if(b.action==='membership-verify'){if(b.code!=='12345678')return{ok:false,json:async()=>({error:'Testcode ist ungültig.'})};data={token:'fixture-proof',expiresAt:Date.now()+1200000};}
 else{const byCode=b.memberCode?.trim().toUpperCase()==='KEEP-CODE';const member=byCode||(b.proof==='fixture-proof'&&b.email.trim().toLowerCase()==='member@example.invalid');data={amount:member?6.75:12.25,source:byCode?'code':member?'verified_member':'guest'};}
 return{ok:true,json:async()=>data};};
function App(){const[email,setEmail]=useState('member@example.invalid'),[code,setCode]=useState(''),[proof,setProof]=useState(null),[quote,setQuote]=useState(null);return React.createElement(React.Fragment,null,
 React.createElement('label',null,'E-Mail',React.createElement('input',{type:'email',value:email,onChange:e=>setEmail(e.target.value)})),
 React.createElement('label',null,'Mitgliedercode',React.createElement('input',{value:code,onChange:e=>setCode(e.target.value)})),
 React.createElement(MembershipTariff,{email,appointmentId:'fixture-date',memberCode:code,onVerification:setProof,onQuote:setQuote}),
 React.createElement('p',{role:'status'},quote?`Tarif: ${quote.amount.toFixed(2)} EUR (${quote.source})`:'Tarif wird geprüft …'),
 React.createElement('p',null,proof?'E-Mail-Nachweis vorhanden':'Kein E-Mail-Nachweis'))}
createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
